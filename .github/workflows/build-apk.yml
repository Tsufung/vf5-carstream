name: Build VF5 CarStream APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Prepare Versioned APK
        run: |
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | tr -dc '0-9')
          APK_NAME="VF5-CarStream-v${VERSION_CODE}.apk"
          echo "Naming APK as: $APK_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          ls -lh "$APK_NAME"

      - name: Upload Versioned APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VF5-CarStream-APK
          path: VF5-CarStream-v*.apk
          retention-days: 30

      - name: Display APK info
        run: |
          echo "=== Build completed successfully ==="
          ls -la VF5-CarStream-v*.apk
